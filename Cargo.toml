[package]
name = "guarddog"
version = "0.1.0"
edition = "2021"
description = "Token safety check for AI agents: PASS/WARN/BITE verdicts in 23ms. Honeypot detection, contract audit, liquidity structure. ETH/BSC/Base/Solana."
license = "MIT"
repository = "https://github.com/guarddog-top/guarddog-rs"
keywords = ["token", "safety", "honeypot", "crypto", "agent"]
categories = ["api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
